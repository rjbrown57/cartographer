definitions:
  backend.ImportResult:
    properties:
      added:
        type: integer
      mode:
        type: string
      skipped:
        type: integer
    type: object
info:
  contact: {}
paths:
  /:
    get:
      consumes:
      - text/html
      description: Serves the main Cartographer web interface
      parameters:
      - collectionFormat: multi
        description: Additional tag names
        in: query
        items:
          type: string
        name: tag
        type: array
      - collectionFormat: multi
        description: Additional term names
        in: query
        items:
          type: string
        name: term
        type: array
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: Serve the main HTML page
      tags:
      - web
  /v1/about:
    get:
      consumes:
      - application/json
      description: Retrieve information about the Cartographer application including
        version, commit, and build date
      produces:
      - application/json
      responses:
        "200":
          description: Application information
          schema:
            additionalProperties: true
            type: object
      summary: Get application information
      tags:
      - info
  /v1/admin/export:
    get:
      description: Requires an admin session cookie from POST /v1/admin/session. Downloads
        an uncompressed, versioned tar containing all namespaces, templates and database
        metadata. Maximum archive size is 256 MiB.
      produces:
      - application/x-tar
      responses:
        "200":
          description: Database archive
          schema:
            type: file
        "401":
          description: Admin authentication required
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Export failed
          schema:
            additionalProperties: true
            type: object
      summary: Export the complete database
      tags:
      - admin
  /v1/admin/import:
    post:
      consumes:
      - multipart/form-data
      description: Requires an admin session cookie from POST /v1/admin/session. replace
        removes existing contents; merge adds missing records and keeps existing namespace/key
        matches, including templates. Values and lifecycle metadata are preserved.
        Invalid archives leave the database unchanged. Maximum file size is 256 MiB;
        multipart overhead is limited to 1 MiB. Counts cover records under data_store;
        added includes every restored record in replace mode.
      parameters:
      - description: Import mode
        enum:
        - replace
        - merge
        in: query
        name: mode
        required: true
        type: string
      - description: Tar archive returned by export
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend.ImportResult'
        "400":
          description: Invalid archive, upload or mode
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Admin authentication required
          schema:
            additionalProperties: true
            type: object
        "413":
          description: Upload too large
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Import failed
          schema:
            additionalProperties: true
            type: object
      summary: Import a database archive
      tags:
      - admin
  /v1/get:
    get:
      consumes:
      - application/json
      description: Retrieve all notes and tags with optional filtering by tags and
        terms via query parameters
      parameters:
      - description: Filter by tag names (comma-separated)
        example: '"oci,k8s"'
        in: query
        name: tag
        type: string
      - description: Filter by term (comma-separated)
        example: '"ko,binman"'
        in: query
        name: term
        type: string
      - description: Filter by exact note ID (comma-separated)
        example: '"note-123"'
        in: query
        name: id
        type: string
      - description: Namespace scope for the query
        example: '"default"'
        in: query
        name: namespace
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Filtered data
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid namespace
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all data with optional filtering
      tags:
      - get
  /v1/get/namespaces:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all active namespaces currently in cache
      produces:
      - application/json
      responses:
        "200":
          description: List of namespaces
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all namespaces
      tags:
      - get
  /v1/get/tags:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available tags
      parameters:
      - description: Namespace scope for the query
        example: '"default"'
        in: query
        name: namespace
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tags
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid namespace
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get all tags
      tags:
      - get
  /v1/get/tags/{tag}:
    get:
      consumes:
      - application/json
      description: Retrieve notes filtered by tag name. Can accept additional tags
        via query parameters.
      parameters:
      - description: Tag name
        example: '"javascript"'
        in: path
        name: tag
        required: true
        type: string
      - collectionFormat: multi
        description: Additional tag names
        in: query
        items:
          type: string
        name: tag
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: Notes filtered by tag
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get notes by tag
      tags:
      - get
  /v1/ping:
    get:
      consumes:
      - application/json
      description: get a simple pong for your ping
      produces:
      - application/json
      responses:
        "200":
          description: Pong
          schema:
            type: string
      summary: Responds with a pong message
      tags:
      - ping
swagger: "2.0"
