<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111827">
	<title>{{.sitename}} · Mobile</title>
	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	<link rel="apple-touch-icon" href="/favicon.ico">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600&amp;display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="/styles/mobile.css">
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
	<script type="module" src="/scripts/mobile/app.js"></script>
</head>
<body>
	<header class="mobile-header">
		<div class="mobile-topbar">
			<a class="mobile-brand" href="/mobile" aria-label="{{.sitename}} mobile home">
				<i class="bi bi-compass"></i>
				<span>{{.sitename}}</span>
			</a>
			<button id="mobileFilterToggle" class="mobile-icon-button" type="button" aria-label="Open filters" aria-controls="mobileFilterSheet" aria-expanded="false">
				<i class="bi bi-sliders2"></i>
			</button>
		</div>
		<form id="mobileSearchForm" class="mobile-search" role="search">
			<i class="bi bi-search" aria-hidden="true"></i>
			<input id="mobileSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="Find a note">
			<button id="mobileSearchClear" class="mobile-search__clear" type="button" aria-label="Clear search"><i class="bi bi-x-circle-fill"></i></button>
		</form>
		<nav id="mobileNamespaces" class="mobile-namespaces" aria-label="Namespaces"></nav>
	</header>

	<main class="mobile-main">
		<section class="mobile-feed-heading" aria-live="polite">
			<div>
				<strong id="mobileResultCount">Loading notes</strong>
				<span id="mobileResultContext"></span>
			</div>
			<button id="mobileFeedFilter" class="mobile-feed-heading__filter" type="button">
				<i class="bi bi-funnel"></i><span>Filter</span>
			</button>
		</section>
		<div id="mobileActiveFilters" class="mobile-active-filters is-empty"></div>
		<section id="mobileFeed" class="mobile-feed" aria-label="Notes" aria-busy="true">
			<div class="mobile-loading"><span></span><span></span><span></span></div>
		</section>
	</main>

	<a id="mobileAddNote" class="mobile-add-note" href="/note?mode=create&amp;namespace=default" aria-label="Add note">
		<i class="bi bi-plus-lg"></i>
	</a>

	<section id="mobileFilterSheet" class="mobile-filter-sheet" aria-hidden="true" inert>
		<button id="mobileFilterBackdrop" class="mobile-filter-sheet__backdrop" type="button" aria-label="Close filters"></button>
		<div class="mobile-filter-sheet__panel" role="dialog" aria-modal="true" aria-labelledby="mobileFilterTitle">
			<div class="mobile-filter-sheet__handle" aria-hidden="true"></div>
			<header class="mobile-filter-sheet__header">
				<div>
					<span class="mobile-eyebrow">Browse</span>
					<h2 id="mobileFilterTitle">Filter notes</h2>
				</div>
				<button id="mobileFilterClose" class="mobile-icon-button mobile-icon-button--light" type="button" aria-label="Close filters"><i class="bi bi-x-lg"></i></button>
			</header>
			<label class="mobile-field">
				<span>Order</span>
				<select id="mobileSort"></select>
			</label>
			<div class="mobile-filter-section">
				<h3>Tags</h3>
				<div id="mobileTagFilters" class="mobile-filter-tags"></div>
			</div>
			<a id="mobileDesktopView" class="mobile-desktop-link" href="/?view=desktop">
				<i class="bi bi-display"></i>
				<span><strong>Desktop site</strong><small>Open the full card workspace and admin tools</small></span>
				<i class="bi bi-chevron-right"></i>
			</a>
		</div>
	</section>
</body>
</html>
