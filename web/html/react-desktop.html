<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .sitename }}</title>
  <script>
    (() => {
      const current = new URL(location.href);
      const requested = current.searchParams.get('view');
      const preferenceKey = 'cartographer_view_preference';
      try {
        if (requested === 'desktop' || requested === 'mobile') localStorage.setItem(preferenceKey, requested);
      } catch { /* Browser storage may be unavailable. */ }
      let preference = '';
      try { preference = localStorage.getItem(preferenceKey) || ''; } catch { /* Use viewport. */ }
      const mobile = requested === 'mobile' || (requested !== 'desktop' && preference !== 'desktop' && matchMedia('(max-width: 720px)').matches);
      current.searchParams.delete('view');
      if (mobile) { current.pathname = '/mobile'; location.replace(current.toString()); }
      else if (requested) history.replaceState(null, '', current);
    })();
  </script>
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles/joy.css">
  <link rel="stylesheet" href="/styles/diagram.css">
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script type="module" src="/scripts/react/desktop.js"></script>
</head>
<body>
  <div id="react-desktop-root" data-site-name="{{ .sitename }}"></div>
</body>
</html>
