<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ .sitename }} Note</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<style>
		:root {
			--bg: #f4f7fb;
			--panel: #ffffff;
			--panel-muted: #f8fafc;
			--border: #cbd5e1;
			--border-strong: #94a3b8;
			--text: #172033;
			--muted: #64748b;
			--accent: #3152d4;
			--accent-dark: #243ca6;
			--danger: #b91c1c;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--bg);
			color: var(--text);
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			margin: 0;
			min-height: 100vh;
		}

		.note-topbar {
			align-items: center;
			backdrop-filter: blur(14px);
			background: rgba(255, 255, 255, 0.94);
			border-bottom: 1px solid var(--border);
			display: flex;
			gap: 1rem;
			justify-content: space-between;
			min-height: 64px;
			padding: 0.65rem clamp(1rem, 3vw, 2rem);
			position: sticky;
			top: 0;
			z-index: 100;
		}

		.note-topbar__identity,
		.note-topbar__actions,
		.note-mode-tabs {
			align-items: center;
			display: flex;
		}

		.note-topbar__identity {
			gap: 0.75rem;
			min-width: 0;
		}

		.note-topbar__actions {
			gap: 0.5rem;
			justify-content: flex-end;
		}

		.note-brand {
			color: var(--accent);
			font-weight: 800;
			max-width: 18rem;
			overflow: hidden;
			text-decoration: none;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.note-context {
			border-left: 1px solid var(--border);
			color: var(--muted);
			font-size: 0.88rem;
			font-weight: 700;
			padding-left: 0.75rem;
			white-space: nowrap;
		}

		.note-action {
			align-items: center;
			background: #ffffff;
			border: 1px solid var(--border);
			border-radius: 999px;
			color: #475569;
			display: inline-flex;
			font-weight: 700;
			gap: 0.4rem;
			padding: 0.45rem 0.75rem;
			text-decoration: none;
			white-space: nowrap;
		}

		.note-action:hover {
			background: #eef2ff;
			border-color: #a5b4fc;
			color: var(--accent);
		}

		.note-action--primary {
			background: var(--accent);
			border-color: var(--accent);
			color: #ffffff;
		}

		.note-action--primary:hover {
			background: var(--accent-dark);
			border-color: var(--accent-dark);
			color: #ffffff;
		}

		.note-action--danger:hover {
			background: #fee2e2;
			border-color: #fecaca;
			color: var(--danger);
		}

		.note-save-status {
			color: var(--muted);
			font-size: 0.82rem;
			font-weight: 700;
			min-width: 5.5rem;
			text-align: right;
		}

		.note-save-status--dirty {
			color: #a16207;
		}

		.note-save-status--success {
			color: #15803d;
		}

		.note-save-status--error {
			color: var(--danger);
		}

		.note-mode-tabs {
			background: #e2e8f0;
			border-radius: 999px;
			gap: 0.2rem;
			padding: 0.18rem;
		}

		.note-mode-tab {
			background: transparent;
			border: 0;
			border-radius: 999px;
			color: #475569;
			font-size: 0.82rem;
			font-weight: 750;
			padding: 0.35rem 0.65rem;
		}

		.note-mode-tab[aria-pressed="true"] {
			background: #ffffff;
			box-shadow: 0 1px 4px rgba(15, 23, 42, 0.16);
			color: #0f172a;
		}

		.note-page {
			margin: 0 auto;
			max-width: 900px;
			padding: 2rem 1rem 4rem;
		}

		.note-page--editor {
			max-width: 1600px;
			padding: 1rem clamp(0.75rem, 2vw, 1.5rem) 1.5rem;
		}

		.note-shell {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
			box-shadow: 0 22px 60px rgba(15, 23, 42, 0.08);
			padding: clamp(1rem, 3vw, 2rem);
		}

		.note-shell--editor {
			background: transparent;
			border: 0;
			border-radius: 0;
			box-shadow: none;
			padding: 0;
		}

		.note-kicker {
			color: var(--muted);
			display: flex;
			flex-wrap: wrap;
			font-size: 0.86rem;
			gap: 0.5rem;
			margin-bottom: 0.75rem;
		}

		.note-title {
			font-size: clamp(2rem, 6vw, 3.25rem);
			line-height: 1.02;
			margin: 0 0 1rem;
		}

		.note-link {
			display: inline-flex;
			gap: 0.4rem;
			margin-bottom: 1rem;
			max-width: 100%;
			overflow-wrap: anywhere;
		}

		.note-tags,
		.note-tag-preview {
			display: flex;
			flex-wrap: wrap;
			gap: 0.4rem;
		}

		.note-tags {
			margin-bottom: 1.25rem;
		}

		.note-tag,
		.note-tag-chip {
			background: #eef2ff;
			border: 1px solid #c7d2fe;
			border-radius: 999px;
			color: #3730a3;
			font-size: 0.78rem;
			font-weight: 700;
			padding: 0.22rem 0.55rem;
		}

		button.note-tag-chip:hover {
			background: #fee2e2;
			border-color: #fecaca;
			color: #991b1b;
		}

		.note-markdown {
			font-size: 1.02rem;
			line-height: 1.68;
		}

		.note-markdown h1,
		.note-markdown h2,
		.note-markdown h3 {
			margin-top: 1.5rem;
		}

		.note-markdown pre,
		.note-data-content {
			background: #0f172a;
			border-radius: 8px;
			color: #e2e8f0;
			overflow-x: auto;
			padding: 1rem;
		}

		.note-markdown code {
			background: #e2e8f0;
			border-radius: 5px;
			padding: 0.1rem 0.25rem;
		}

		.note-markdown pre code {
			background: transparent;
			padding: 0;
		}

		.note-data-section {
			background: var(--panel-muted);
			border: 1px solid var(--border);
			border-radius: 8px;
			margin-top: 1.5rem;
			padding: 1rem;
		}

		.note-data-header {
			align-items: center;
			display: flex;
			gap: 0.75rem;
			justify-content: space-between;
			margin-bottom: 0.75rem;
		}

		.note-data-title,
		.note-field-label,
		.note-inspector__title {
			color: var(--muted);
			font-size: 0.78rem;
			font-weight: 800;
			letter-spacing: 0.055em;
			text-transform: uppercase;
		}

		.note-data-title {
			margin: 0;
		}

		.note-data-content {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
			font-size: 0.82rem;
			margin: 0;
			max-height: 460px;
			overflow: auto;
		}

		.note-empty {
			border: 1px dashed var(--border);
			border-radius: 12px;
			color: var(--muted);
			padding: 1.5rem;
		}

		.note-editor {
			display: grid;
			gap: 1rem;
			grid-template-areas: "inspector main";
			grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
			min-height: calc(100vh - 96px);
		}

		.note-editor__main,
		.note-editor__inspector {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
			box-shadow: 0 16px 44px rgba(15, 23, 42, 0.07);
		}

		.note-editor__main {
			display: flex;
			flex-direction: column;
			grid-area: main;
			min-width: 0;
			overflow: hidden;
		}

		.note-editor__title-wrap {
			border-bottom: 1px solid var(--border);
			padding: 1rem 1.25rem;
		}

		.note-editor__title {
			background: transparent;
			border: 0;
			color: var(--text);
			font-size: clamp(1.6rem, 3vw, 2.45rem);
			font-weight: 750;
			line-height: 1.15;
			outline: 0;
			padding: 0;
			width: 100%;
		}

		.note-editor__title::placeholder {
			color: #94a3b8;
		}

		.note-editor__body-header {
			align-items: center;
			background: var(--panel-muted);
			border-bottom: 1px solid var(--border);
			display: flex;
			justify-content: space-between;
			padding: 0.55rem 1rem;
		}

		.note-editor__shortcut {
			color: var(--muted);
			font-size: 0.78rem;
		}

		.note-editor__panes {
			display: grid;
			flex: 1;
			grid-template-columns: minmax(0, 1fr);
			min-height: 0;
		}

		.note-editor__panes[data-mode="split"] {
			grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
		}

		.note-editor__textarea,
		.note-editor__preview {
			border: 0;
			min-height: calc(100vh - 224px);
			outline: 0;
		}

		.note-editor__textarea {
			background: #ffffff;
			color: #172033;
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
			font-size: 0.97rem;
			line-height: 1.65;
			padding: 1.25rem clamp(1rem, 3vw, 2rem);
			resize: none;
			width: 100%;
		}

		.note-editor__preview {
			background: #ffffff;
			border-left: 1px solid var(--border);
			overflow-y: auto;
			padding: 1.5rem clamp(1rem, 3vw, 2.5rem);
		}

		.note-editor__preview > * {
			max-width: 72ch;
		}

		.note-editor__panes[data-mode="write"] .note-editor__preview,
		.note-editor__panes[data-mode="preview"] .note-editor__textarea {
			display: none;
		}

		.note-editor__panes[data-mode="preview"] .note-editor__preview {
			border-left: 0;
		}

		.note-editor__inspector {
			align-self: start;
			display: grid;
			gap: 1rem;
			grid-area: inspector;
			max-height: calc(100vh - 96px);
			overflow-y: auto;
			padding: 1rem;
			position: sticky;
			top: 80px;
		}

		.note-inspector__title {
			margin: 0;
		}

		.note-field {
			display: grid;
			gap: 0.35rem;
		}

		.note-field .form-control,
		.note-field .form-select {
			border-color: var(--border);
		}

		.note-field .form-control:focus,
		.note-field .form-select:focus {
			border-color: #818cf8;
			box-shadow: 0 0 0 0.2rem rgba(99, 102, 241, 0.15);
		}

		.note-tag-preview {
			min-height: 1.65rem;
		}

		.note-data-details {
			background: var(--panel-muted);
			border: 1px dashed var(--border-strong);
			border-radius: 8px;
			padding: 0.7rem;
		}

		.note-data-details summary {
			color: #475569;
			cursor: pointer;
			font-size: 0.84rem;
			font-weight: 750;
		}

		.note-data-textarea {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
			font-size: 0.82rem;
			margin-top: 0.65rem;
			min-height: 180px;
			resize: vertical;
		}

		.note-field-error {
			color: var(--danger);
			font-size: 0.8rem;
		}

		.note-editor__mobile-actions {
			display: none;
		}

		.is-hidden {
			display: none !important;
		}

		@media (max-width: 1100px) {
			.note-editor {
				grid-template-columns: 300px minmax(0, 1fr);
			}

			.note-mode-tab[data-editor-mode="split"] {
				display: none;
			}

			.note-editor__panes[data-mode="split"] {
				grid-template-columns: minmax(0, 1fr);
			}

			.note-editor__panes[data-mode="split"] .note-editor__preview {
				display: none;
			}
		}

		@media (max-width: 820px) {
			.note-topbar {
				align-items: flex-start;
				flex-wrap: wrap;
			}

			.note-topbar__identity {
				flex: 1 1 auto;
			}

			.note-context,
			.note-action__label,
			.note-save-status {
				display: none;
			}

			.note-editor {
				display: flex;
				flex-direction: column;
			}

			.note-editor__textarea,
			.note-editor__preview {
				min-height: 58vh;
			}

			.note-editor__inspector {
				align-self: stretch;
				max-height: none;
				order: 2;
				position: static;
				width: 100%;
			}

			.note-editor__shortcut {
				display: none;
			}
		}

		@media (max-width: 560px) {
			.note-brand {
				max-width: 10rem;
			}

			.note-topbar__actions {
				gap: 0.35rem;
			}

			.note-action {
				padding: 0.42rem 0.58rem;
			}

			.note-mode-tab {
				padding: 0.32rem 0.5rem;
			}

			.note-page,
			.note-page--editor {
				padding-left: 0.6rem;
				padding-right: 0.6rem;
			}

			.note-editor__title-wrap,
			.note-editor__textarea,
			.note-editor__preview {
				padding-left: 1rem;
				padding-right: 1rem;
			}
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
	<script type="module" src="/scripts/note.js"></script>
</head>
<body>
	<header class="note-topbar">
		<div class="note-topbar__identity">
			<a id="backLink" class="note-action" href="/" aria-label="Back to notes">
				<i class="bi bi-arrow-left"></i>
			</a>
			<a id="siteName" class="note-brand" href="/"><i class="bi bi-compass"></i> {{ .sitename }}</a>
			<span id="pageContext" class="note-context">Note</span>
		</div>
		<div id="readerActions" class="note-topbar__actions">
			<button id="editNote" class="note-action is-hidden" type="button">
				<i class="bi bi-pencil-square"></i>
				<span class="note-action__label">Edit</span>
			</button>
			<button id="deleteNote" class="note-action note-action--danger is-hidden" type="button">
				<i class="bi bi-trash"></i>
				<span class="note-action__label">Delete</span>
			</button>
			<a id="rawLink" href="#" target="_blank" rel="noopener noreferrer" class="note-action is-hidden">
				<i class="bi bi-code-slash"></i>
				<span class="note-action__label">Raw</span>
			</a>
		</div>
		<div id="editorActions" class="note-topbar__actions is-hidden">
			<span id="saveStatus" class="note-save-status" aria-live="polite">All changes saved</span>
			<div class="note-mode-tabs" role="group" aria-label="Editor mode">
				<button class="note-mode-tab" data-editor-mode="write" type="button" aria-pressed="true">Write</button>
				<button class="note-mode-tab" data-editor-mode="split" type="button" aria-pressed="false">Split</button>
				<button class="note-mode-tab" data-editor-mode="preview" type="button" aria-pressed="false">Preview</button>
			</div>
			<button id="cancelEdit" class="note-action" type="button">
				<i class="bi bi-x-lg"></i>
				<span class="note-action__label">Cancel</span>
			</button>
			<button id="saveNote" class="note-action note-action--primary" type="submit" form="noteEditorForm">
				<i class="bi bi-check2"></i>
				<span id="saveNoteLabel" class="note-action__label">Save</span>
			</button>
		</div>
	</header>
	<main id="notePage" class="note-page">
		<article id="noteShell" class="note-shell" aria-live="polite">
			<div class="note-empty">Loading note...</div>
		</article>
	</main>
</body>
</html>
